<title>قرار تشغيل EduMind</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Poppins:wght@500;600;700&display=swap');

  /* ===== ats-ware brand tokens (from src/styles/tokens/colors.css) ===== */
  :root{
    --navy:#0d1526;
    --deep:#0b1b2f;
    --green:#65c6bf;
    --green-ink:#11141e;
    --gray:#667080;

    --bg:#ffffff;
    --surface:#ffffff;
    --card:#f9f9fb;
    --elevated:#f5f7fa;
    --heading:#0d1526;
    --body:#667080;
    --border:#e5e8eb;
    --track:#eef1f4;
    --band-a:#0d1526;
    --band-b:#0b1b2f;
    --on-band:#ffffff;
    --on-band-soft:#c3ccd6;
    --cost:#0d1526;

    --shadow-sm:0 1px 2px rgba(13,21,38,.05);
    --shadow-md:0 4px 12px -2px rgba(13,21,38,.08), 0 2px 4px -2px rgba(13,21,38,.05);
    --shadow-lg:0 12px 28px -6px rgba(13,21,38,.12), 0 4px 8px -4px rgba(13,21,38,.06);

    --r-md:.5rem; --r-lg:.75rem; --r-xl:1rem; --r-full:9999px;
    --ff:'Tajawal', system-ui, 'Segoe UI', sans-serif;
    --ff-latin:'Poppins','Tajawal',sans-serif;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#11141e; --surface:#11141e; --card:#171b26; --elevated:#252935;
      --heading:#ffffff; --body:#a6adb8; --border:#333847; --track:#252935;
      --band-a:#0d1526; --band-b:#0b1b2f; --on-band:#ffffff; --on-band-soft:#a6adb8;
      --cost:#c3ccd6;
      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
      --shadow-md:0 4px 12px -2px rgba(0,0,0,.5),0 2px 4px -2px rgba(0,0,0,.4);
      --shadow-lg:0 12px 28px -6px rgba(0,0,0,.6),0 4px 8px -4px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#11141e; --surface:#11141e; --card:#171b26; --elevated:#252935;
    --heading:#ffffff; --body:#a6adb8; --border:#333847; --track:#252935;
    --band-a:#0d1526; --band-b:#0b1b2f; --on-band:#ffffff; --on-band-soft:#a6adb8;
    --cost:#c3ccd6;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 4px 12px -2px rgba(0,0,0,.5),0 2px 4px -2px rgba(0,0,0,.4);
    --shadow-lg:0 12px 28px -6px rgba(0,0,0,.6),0 4px 8px -4px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--body);font-family:var(--ff);line-height:1.65}
  #app{direction:rtl}
  .wrap{max-width:1000px;margin:0 auto;padding-inline:18px;padding-bottom:22px}

  h1,h2,h3{color:var(--heading);margin:0;line-height:1.25;text-wrap:balance;font-weight:800}
  .latin{font-family:var(--ff-latin);font-weight:600;letter-spacing:.2px}

  /* ===== Header ===== */
  header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
    background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border)}
  .site-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 22%,transparent)}
  .brand b{font-family:var(--ff-latin);font-weight:700;font-size:18px;color:var(--heading)}
  .brand b i{color:var(--green);font-style:normal}
  .tbtn{border:1px solid var(--border);background:var(--surface);color:var(--body);border-radius:var(--r-full);
    width:38px;height:38px;display:grid;place-items:center;cursor:pointer;transition:.15s}
  .tbtn:hover{color:var(--green);border-color:var(--green)}
  .tbtn:focus-visible{outline:2px solid var(--green);outline-offset:2px}

  /* ===== Hero band ===== */
  .hero{margin-top:16px}
  .band{background:linear-gradient(135deg,var(--band-a),var(--band-b));border-radius:var(--r-xl);
    padding:34px 30px;color:var(--on-band);box-shadow:var(--shadow-lg);position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:space-between;gap:26px;flex-wrap:wrap}
  .band::after{content:"";position:absolute;inset-inline-start:-60px;inset-block-start:-60px;
    width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--green) 30%,transparent),transparent 70%)}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;
    background:color-mix(in srgb,#fff 12%,transparent);color:#fff;padding:6px 13px;border-radius:var(--r-full);
    border:1px solid color-mix(in srgb,#fff 16%,transparent)}
  .eyebrow .d{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .band h1{color:#fff;font-size:clamp(22px,4vw,32px);margin:0;max-width:27ch;line-height:1.4;text-wrap:balance;position:relative;z-index:1}
  .band-logo{flex:none;color:#fff;line-height:0;position:relative;z-index:1}
  .band-logo svg{height:46px;width:auto;display:block}
  @media(max-width:560px){.band-logo svg{height:38px}}
  .band p{color:var(--on-band-soft);font-size:clamp(15px,2.2vw,17px);margin:0;max-width:58ch}

  /* ===== Section ===== */
  section{margin-top:24px}
  .sec-head{margin-bottom:16px}
  .sec-head h2{font-size:21px}
  .sec-head p{margin:6px 0 0;font-size:14px;color:var(--body)}

  /* ===== Explorer grid ===== */
  .explorer{display:block}

  .options{display:grid;gap:12px;margin-bottom:18px}
  @media(min-width:560px){.options{grid-template-columns:1fr 1fr}}
  .opt{width:100%;text-align:start;font-family:inherit;color:inherit;cursor:pointer;
    background:var(--surface);border:1.6px solid var(--border);border-radius:var(--r-lg);
    padding:15px 16px;transition:border-color .18s,box-shadow .18s,transform .18s;box-shadow:var(--shadow-sm);position:relative}
  .opt:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);border-color:color-mix(in srgb,var(--green) 45%,var(--border))}
  .opt:focus-visible{outline:2px solid var(--green);outline-offset:3px}
  .opt[aria-pressed="true"]{border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 26%,transparent),var(--shadow-md)}
  .opt-row{display:flex;align-items:center;gap:12px}
  .opt .title{font-weight:700;color:var(--heading);font-size:15.5px;flex:1}
  .opt .grp{font-size:11px;color:var(--body);background:var(--card);border:1px solid var(--border);
    padding:2px 9px;border-radius:var(--r-full);white-space:nowrap}
  .opt .more{margin-top:2px;margin-inline-start:0;background:none;border:none;color:var(--green);
    font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;padding:6px 0 0;display:inline-flex;align-items:center;gap:5px}
  .opt .more:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:4px}
  .opt .detail{margin-top:8px;margin-inline-start:0;font-size:13.5px;color:var(--body);
    max-block-size:0;overflow:hidden;opacity:0;transition:max-block-size .28s ease,opacity .28s ease}
  .opt.open .detail{max-block-size:120px;opacity:1}
  .opt .more .chev{transition:transform .2s}
  .opt.open .more .chev{transform:rotate(180deg)}

  /* ===== Gauges panel ===== */
  .panel{background:var(--card);border:1.6px solid var(--border);border-radius:var(--r-xl);
    padding:18px 18px 20px;box-shadow:var(--shadow-sm)}
  /* panel spans full width below the options */
  .panel-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
  .panel-top .k{font-size:12px;color:var(--body);font-weight:700}
  .panel-top .v{font-size:15px;font-weight:800;color:var(--heading)}
  .costchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
    color:var(--heading);background:var(--elevated);border:1px solid var(--border);padding:5px 11px;border-radius:var(--r-full);margin-top:10px}
  .costchip .cd{width:7px;height:7px;border-radius:50%;background:var(--cost)}

  .gauges{margin-top:16px;display:grid;gap:18px}
  @media(min-width:560px){.gauges{grid-template-columns:1fr 1fr;gap:20px 32px}}
  .gauge .g-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
  .gauge .g-name{font-size:13.5px;font-weight:700;color:var(--heading)}
  .gauge .g-level{font-size:12.5px;font-weight:700;color:var(--green)}
  .gauge.cost .g-level{color:var(--cost)}
  .track{position:relative;height:8px;border-radius:var(--r-full);background:var(--track);border:1px solid var(--border)}
  .fill{position:absolute;inset-block:0;inset-inline-start:0;inline-size:0;border-radius:var(--r-full);
    background:var(--green);transition:inline-size .6s cubic-bezier(.22,.61,.36,1)}
  .gauge.cost .fill{background:var(--cost)}
  .thumb{position:absolute;inset-block-start:50%;inset-inline-start:0;width:18px;height:18px;border-radius:50%;
    background:#fff;border:3px solid var(--green);box-shadow:var(--shadow-md);
    transform:translateY(-50%);margin-inline-start:-9px;
    transition:inset-inline-start .6s cubic-bezier(.22,.61,.36,1)}
  .gauge.cost .thumb{border-color:var(--cost)}
  .scale{position:absolute;inset-block-start:15px;font-size:10.5px;color:var(--body)}
  .scale.min{inset-inline-start:0}
  .scale.max{inset-inline-end:0}
  .gauge{padding-bottom:14px}
  .ghint{font-size:11.5px;color:var(--body);margin-top:14px;display:flex;align-items:center;gap:6px}
  .ghint .cd{width:7px;height:7px;border-radius:50%;background:var(--cost);flex:none}

  /* ===== Quiz ===== */
  .quiz{background:var(--surface);border:1.6px solid var(--border);border-radius:var(--r-xl);padding:20px;box-shadow:var(--shadow-sm)}
  .q{margin-bottom:18px}
  .q:last-of-type{margin-bottom:0}
  .q-t{font-size:14.5px;font-weight:700;color:var(--heading);margin:0 0 10px}
  .opts3{display:grid;gap:8px;grid-template-columns:1fr}
  @media(min-width:560px){.opts3{grid-template-columns:1fr 1fr 1fr}}
  .chip{border:1.5px solid var(--border);background:var(--card);border-radius:var(--r-md);padding:11px 12px;
    font-family:inherit;color:var(--body);font-size:13.5px;cursor:pointer;text-align:start;transition:.15s;line-height:1.45}
  .chip:hover{border-color:color-mix(in srgb,var(--green) 45%,var(--border))}
  .chip:focus-visible{outline:2px solid var(--green);outline-offset:2px}
  .chip[aria-pressed="true"]{border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,var(--surface));color:var(--heading);font-weight:700}
  .qa{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{font-family:inherit;font-weight:700;font-size:14px;border-radius:var(--r-md);padding:11px 20px;cursor:pointer;border:1px solid transparent;transition:.15s}
  .btn-primary{background:var(--green);color:var(--green-ink)}
  .btn-primary:hover{filter:brightness(1.05)}
  .btn:focus-visible{outline:2px solid var(--green);outline-offset:2px}
  .qnote{font-size:12.5px;color:var(--body)}

  /* ===== Recommendation ===== */
  .rec{margin-top:16px;border:1.6px solid var(--green);border-radius:var(--r-xl);overflow:hidden;display:none;box-shadow:var(--shadow-md)}
  .rec.show{display:block}
  .rec .top{background:linear-gradient(135deg,var(--band-a),var(--band-b));color:#fff;padding:16px 20px}
  .rec .top .lab{font-size:12px;font-weight:700;color:var(--green)}
  .rec .top .name{font-size:19px;font-weight:800;color:#fff;margin-top:3px}
  .rec .body{padding:16px 20px;background:var(--surface)}
  .rec .body p{margin:0;font-size:14px;color:var(--body)}

  footer{margin:40px 0 10px;padding-top:18px;border-top:1px solid var(--border);color:var(--body);font-size:12.5px;text-align:center}

  @media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>

<div id="app">
  <header class="site">
    <div class="site-in">
      <div class="brand">
        <span class="dot"></span>
        <b>Edu<i>Mind</i></b>
      </div>
      <button class="tbtn" id="themeBtn" type="button" aria-label="تبديل الوضع الليلي">
        <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="band">
        <h1>خيارات استضافة خدمات الذكاء الاصطناعي في الجامعة</h1>
        <span class="band-logo" role="img" aria-label="ats-ware">
          <svg width="150" height="48" viewBox="0 0 107 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M18.0686 23.6155V33.8388H0V15.7703H10.2142V23.6155H18.0686Z" fill="#65C6BF"></path>
            <path d="M28.2785 5.54028V23.6088H18.0643V15.7636H10.21V5.54028H28.2785Z" fill="#65C6BF"></path>

          </svg>
        </span>
      </div>
    </section>

    <section>
      <div class="sec-head">
        <h2>اختر خيار التشغيل</h2>
        <p>اضغط على أي خيار لتنزلق المؤشرات في الأسفل إلى مستوياته.</p>
      </div>

      <div class="options" id="options"></div>

      <div class="panel">
        <div class="panel-top">
          <span class="k">لوحة المؤشرات</span>
          <span class="v" id="panelName">—</span>
        </div>
        <span class="costchip"><span class="cd"></span><span id="costModel">—</span></span>

        <div class="gauges" id="gauges"></div>

        <div class="ghint"><span class="cd"></span> مؤشر التكلفة بالأزرق: كلّما ارتفع زادت التكلفة.</div>
      </div>
    </section>

  </main>

<script>
/* ===== data (levels 0..3) ===== */
var SOL = [
  {id:"onprem", grp:"الخاص", cost:"لمرة واحدة (رأسمالي)",
   name:"خادم مملوك داخل الجامعة (On-Premise)",
   desc:"خصوصية كاملة وأداء عالٍ، مع تكلفة رأسمالية لمرة واحدة لشراء الأجهزة دون رسوم شهرية.",
   m:{privacy:3,performance:3,ease:2,cost:2}},
  {id:"rented", grp:"الخاص", cost:"اشتراك دوري ثابت",
   name:"خادم خاص مستأجر (Rented Private Server)",
   desc:"قوة معالجة خاصة بالكامل للجامعة مستأجرة من مزوّد عالمي (Oracle / Google / AWS)، باشتراك دوري وهو الأعلى تكلفة.",
   m:{privacy:3,performance:3,ease:2,cost:3}},
  {id:"cloud", grp:"السحابي", cost:"الدفع حسب الاستهلاك",
   name:"الربط السحابي عبر الواجهات",
   desc:"ربط مباشر بمزوّدي الذكاء الاصطناعي العالميين (OpenAI, Claude, DeepSeek, Qwen): الأسهل والأقل تكلفة تأسيسية، بخصوصية وأداء أقل.",
   m:{privacy:1,performance:2,ease:3,cost:1}},
  {id:"hybrid", grp:"الهجين", cost:"تكلفة مرنة",
   name:"الحل الهجين",
   desc:"مزيج بين الخادم الخاص والسحابة لضمان استقرار الخدمة واستيعاب أوقات الذروة، مع مرونة في التكلفة.",
   m:{privacy:2,performance:3,ease:2,cost:2}}
];
var DIMS=[
  {k:"privacy",label:"الخصوصية"},
  {k:"performance",label:"الأداء"},
  {k:"ease",label:"سهولة التركيب"},
  {k:"cost",label:"التكلفة",cost:true}
];
var LEVEL={1:"منخفض",2:"متوسط",3:"مرتفع"};
var byId={}; SOL.forEach(function(s){byId[s.id]=s;});
var selected="onprem";

/* ===== options ===== */
var optHost=document.getElementById("options");
SOL.forEach(function(s){
  var b=document.createElement("div");
  b.className="opt";
  b.setAttribute("role","button");
  b.setAttribute("tabindex","0");
  b.setAttribute("aria-pressed","false");
  b.setAttribute("data-sel",s.id);
  b.innerHTML=
    '<div class="opt-row">'
    +'<span class="title">'+s.name+'</span>'
    +'<span class="grp">'+s.grp+'</span>'
    +'</div>'
    +'<button type="button" class="more" data-more="'+s.id+'">تفاصيل الخيار <span class="chev">▾</span></button>'
    +'<div class="detail">'+s.desc+'</div>';
  optHost.appendChild(b);
});
optHost.querySelectorAll('.opt').forEach(function(card){
  card.addEventListener("click",function(){ select(card.getAttribute("data-sel")); });
  card.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); select(card.getAttribute("data-sel")); }});
});
optHost.querySelectorAll('[data-more]').forEach(function(btn){
  btn.addEventListener("click",function(){ btn.closest(".opt").classList.toggle("open"); });
});

/* ===== gauges ===== */
var gHost=document.getElementById("gauges");
DIMS.forEach(function(d){
  var g=document.createElement("div");
  g.className="gauge"+(d.cost?" cost":"");
  g.innerHTML=
    '<div class="g-head"><span class="g-name">'+d.label+'</span><span class="g-level" data-lvl="'+d.k+'">—</span></div>'
    +'<div class="track">'
    +'<div class="fill" data-fill="'+d.k+'"></div>'
    +'<div class="thumb" data-thumb="'+d.k+'"></div>'
    +'<span class="scale min">منخفض</span><span class="scale max">مرتفع</span>'
    +'</div>';
  gHost.appendChild(g);
});

function paint(){
  var s=byId[selected];
  document.querySelectorAll('#options [data-sel]').forEach(function(b){
    b.setAttribute("aria-pressed", String(b.getAttribute("data-sel")===selected));
  });
  document.getElementById("panelName").textContent=s.name.split(" (")[0];
  document.getElementById("costModel").textContent="نموذج التكلفة: "+s.cost;
  DIMS.forEach(function(d){
    var v=s.m[d.k], pct=(v/3)*100;
    gHost.querySelector('[data-fill="'+d.k+'"]').style.insetInlineStart="0";
    gHost.querySelector('[data-fill="'+d.k+'"]').style.inlineSize=pct+"%";
    gHost.querySelector('[data-thumb="'+d.k+'"]').style.insetInlineStart=pct+"%";
    gHost.querySelector('[data-lvl="'+d.k+'"]').textContent=LEVEL[v];
  });
}
function select(id){ selected=id; paint(); }

/* ===== theme ===== */
var root=document.documentElement;
function applyIcon(){
  var dark = root.getAttribute("data-theme")==="dark" ||
    (!root.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.getElementById("themeIcon").innerHTML = dark
    ? '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>'
    : '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
}
try{var sv=localStorage.getItem("edumind_theme"); if(sv) root.setAttribute("data-theme",sv);}catch(e){}
document.getElementById("themeBtn").addEventListener("click",function(){
  var cur=root.getAttribute("data-theme");
  var next = cur==="dark" ? "light" : (cur==="light" ? "dark" :
    (window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark"));
  root.setAttribute("data-theme",next);
  try{localStorage.setItem("edumind_theme",next);}catch(e){}
  applyIcon();
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyIcon);

/* ===== boot ===== */
paint(); applyIcon();
</script>
